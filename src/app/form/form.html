<div class="status-container">
  <div class="status-card">
    <div class="badge-container">
      <span class="pulse-dot"></span>
      <span class="badge-text">SHIFT ACTIVE</span>
    </div>

    <h2>You are currently live</h2>
    <p class="description">
      Welcome, <strong>{{ authService.currentUser()?.fullName || 'Worker' }}</strong>.<br>
      Your location is actively syncing with the team map.
    </p>

    <div class="info-box">
      <p>📍 <strong>Status:</strong> Broadcasting GPS Coordinates</p>
    </div>

    <button (click)="endShiftAndLogout()" class="btn-end-shift">
      End Shift & Logout
    </button>
  </div>
</div>
