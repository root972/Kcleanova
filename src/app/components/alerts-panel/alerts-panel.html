<div class="alerts-header">
  <div>
    <h3>Alerts</h3>
    <p class="alert-subtext">Grace period: {{ geofenceConfig.gracePeriodSeconds }}s | Radius: {{ geofenceConfig.radiusMeters }}m</p>
  </div>
  <button class="sound-toggle" (click)="toggleSound()">
    {{ soundEnabled ? 'Disable Sound Notifications' : 'Enable Sound Notifications' }}
  </button>
</div>
<div class="alerts-container">
  @if (alerts.length > 0) {
    <div class="alert-box red">
      <button (click)="clearAlerts()" class="clear-btn">Clear Alerts</button>
      @for (alert of alerts; track $index) {
        <p class="alert-item">{{ alert }}</p>
      }
    </div>
  } @else {
    <div class="alert-box green">
      <p>✅ All workers are within the construction site boundary.</p>
    </div>
  }
</div>
