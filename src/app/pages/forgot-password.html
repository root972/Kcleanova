<div class="auth-container">
  <div class="auth-card">
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your account email to receive a reset link</p>

    <div *ngIf="error()" class="error-alert">{{ error() }}</div>
    <div *ngIf="message()" class="success-alert">{{ message() }}</div>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" name="email" [(ngModel)]="email" type="email" required />
      </div>

      <button type="submit" [disabled]="isLoading()" class="btn-primary">{{ isLoading() ? 'Sending...' : 'Send Reset Link' }}</button>
    </form>

    <p class="footer-text"><a routerLink="/login">Back to Login</a></p>
  </div>
</div>
