<div class="auth-container">
  <div class="auth-card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter a new password for your account</p>

    <div *ngIf="error()" class="error-alert">{{ error() }}</div>
    <div *ngIf="message()" class="success-alert">{{ message() }}</div>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input id="newPassword" name="newPassword" [(ngModel)]="newPassword" type="password" required minlength="6" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" type="password" required minlength="6" />
      </div>

      <button type="submit" [disabled]="isLoading()" class="btn-primary">{{ isLoading() ? 'Resetting...' : 'Reset Password' }}</button>
    </form>

    <p class="footer-text"><a routerLink="/login">Back to Login</a></p>
  </div>
</div>
